name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'iOS marketing version (for example 1.0.0)'
        required: false
        default: '1.0.0'
      build_number:
        description: 'iOS build number; must be a positive integer'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA (Unsigned for Sideloading)
    runs-on: macos-latest

    env:
      # This workflow intentionally creates an unsigned device app. iLoader
      # will sign it with the Apple account/certificate configured there.
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Use CocoaPods for iOS Plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS App
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [[ -z "$BUILD_NUMBER" ]]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer, got: $BUILD_NUMBER" >&2
            exit 1
          fi

          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ inputs.build_name }}" \
            --build-number "$BUILD_NUMBER"

      - name: Create IPA Package
        run: |
          set -euo pipefail
          APP_PATH="${GITHUB_WORKSPACE}/build/ios/iphoneos/Runner.app"
          PAYLOAD_DIR="${RUNNER_TEMP}/iman-ipa/Payload"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -x "$APP_PATH/Runner"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [[ "$BUNDLE_ID" != "com.elboraeyy.iman" ]]; then
            echo "Unexpected bundle identifier: $BUNDLE_ID" >&2
            exit 1
          fi

          rm -rf "${RUNNER_TEMP}/iman-ipa"
          mkdir -p "$PAYLOAD_DIR"
          ditto "$APP_PATH" "$PAYLOAD_DIR/Runner.app"

          # iOS expects the application bundle directly under Payload.
          (cd "${RUNNER_TEMP}/iman-ipa" && /usr/bin/zip -qry -y "${GITHUB_WORKSPACE}/Iman.ipa" Payload)
          /usr/bin/unzip -t "${GITHUB_WORKSPACE}/Iman.ipa"
          /usr/bin/unzip -Z1 "${GITHUB_WORKSPACE}/Iman.ipa" | grep -Fxq 'Payload/Runner.app/Info.plist'

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Iman_IPA
          path: Iman.ipa
          if-no-files-found: error
          retention-days: 7
