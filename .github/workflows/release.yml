name: Build & Publish Release (APK + IPA)

# بناء نسخ التثبيت ونشرها تلقائيًا في صفحة Releases:
#   - Android: ملف APK جاهز للتثبيت المباشر على الجوال.
#     ولو Shorebird مفعّل (shorebird.yaml + سر SHOREBIRD_TOKEN موجودين):
#       • تعديلات Dart/Assets فقط → تحديث فوري (OTA Patch) يوصل لكل المستخدمين بدون إعادة تثبيت.
#       • تعديلات Native أو نسخة جديدة أو تشغيل يدوي/تاج → shorebird release كاملة (+ APK جديد في Releases).
#       • ولو الـ patch فشل لأي سبب → يرجع تلقائيًا لعمل نسخة كاملة.
#       • لا يوجد تغيّر مهم → لا بناء إطلاقًا والمهمة تُنجَح برضه.
#     ولو Shorebird مش مفعّل → بناء عادي بـ flutter build apk (زي الأول).
#   - iOS: ملف IPA غير موقّع — يثبَّت عبر إعادة التوقيع (Sideloadly / AltStore / iLoader).
#
# طرق التشغيل:
#   1) يدويًا من تبويب Actions (Run workflow).
#   2) تلقائيًا مع كل رفع (push) على فرع main.
#   3) تلقائيًا عند إضافة تاج يبدأ بـ v (مثل v1.0.1) — وتقدر تستخدمن اسمه كما هو للنسخة.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # 1) تصنيف التغييرات — سريع جدًا (بدون بناء)
  #    version / mode (none|plain|patch|release) / shorebird_ready
  # ================================================================
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      mode: ${{ steps.meta.outputs.mode }}
      shorebird_ready: ${{ steps.meta.outputs.shorebird_ready }}
    steps:
      # fetch-depth: 0 لأننا بنقارن ملفات آخر تنفيذ
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & change mode
        id: meta
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | cut -d'+' -f1 | tr -d ' \r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

          SHOREBIRD_READY="false"
          if [ -f shorebird.yaml ] && [ -n "${SHOREBIRD_TOKEN:-}" ]; then
            SHOREBIRD_READY="true"
          fi
          echo "shorebird_ready=$SHOREBIRD_READY" >> "$GITHUB_OUTPUT"

          # 1) تشغيل يدوي أو دفع تاج → نسخة كاملة
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            MODE="release"
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # فرع جديد (مفيش نقطة مقارنة) → نسخة كاملة بأمان
            MODE="release"
          elif [ "$SHOREBIRD_READY" = "true" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
            # تغييرات native أو إعداد → لازم نسخة كاملة (الـ patch مش بيقبل Native)
            if echo "$CHANGED" | grep -Eq '^(android/|ios/|pubspec\.yaml$|pubspec\.lock$|shorebird\.yaml$)'; then
              MODE="release"
            # Dart أو Assets بس → تحديث فوري (OTA)
            elif echo "$CHANGED" | grep -Eq '^(lib/|assets/)'; then
              MODE="patch"
            else
              MODE="none"
            fi
          else
            # من غير Shorebird: أي تغيّر يستحق بناء عادي (السلوك القديم)
            MODE="plain"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE (shorebird_ready=$SHOREBIRD_READY)"

  # ================================================================
  # 2) بناء APK للأندرويد (Ubuntu) — مع منطق Shorebird OTA
  # ================================================================
  android:
    name: Build Android APK
    needs: classify
    # mode=none يعني مفيش أي بناء خالص
    if: ${{ needs.classify.outputs.mode != 'none' }}
    outputs:
      version: ${{ needs.classify.outputs.version }}
      mode: ${{ steps.build.outputs.mode }}
      apk_ready: ${{ steps.build.outputs.apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (required by AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # نحافظ على نفس مفتاح الـ debug بين التنفيذات — حتى يشتغل
      # التحديث (تثبيت فوق النسخة القديمة) من نفس المصدر في كل مرة
      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: iman-debug-keystore-v1

      # مسار Shorebird: الـ CLI بيجيب نسخة Flutter خاصة بيه بنفسه
      - name: Setup Shorebird
        if: ${{ needs.classify.outputs.shorebird_ready == 'true' }}
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # نثبت Flutter على الـ PATH دايمًا (لـ flutter pub get ولـ fallback داخلي
      # لو shorebird release فشل) — Shorebird نفسه بيستخدم نسخته الخاصة للبناء
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # ==============================================================
      # البناء الفعلي حسب التصنيف:
      #   patch   → shorebird patch (OTA) — ولو فشل تُبنى نسخة كاملة
      #   release → shorebird release كاملة (رشم بناء = رقم التشغيل)
      #   plain   → flutter build apk (بدون Shorebird)
      # ==============================================================
      - name: Build (Shorebird release / patch / plain)
        id: build
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          MODE='${{ needs.classify.outputs.mode }}'
          VERSION='${{ needs.classify.outputs.version }}'

          if [ "$MODE" = "patch" ]; then
            echo "::group::Shorebird OTA patch"
            if shorebird patch android --release-version latest --track stable --allow-asset-diffs; then
              echo "::notice::OTA patch published successfully (updates will reach users within a few minutes)."
              echo "mode=patched" >> "$GITHUB_OUTPUT"
              echo "apk=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::shorebird patch failed (no release yet? native diff?) — falling back to a full release."
            echo "::endgroup::"
            MODE="release"
          fi

          if [ "$MODE" = "release" ]; then
            echo "::group::Shorebird full release (version will be $VERSION+$GITHUB_RUN_NUMBER)"
            # نسبط Flutter 3.41.9 (نفس نسخة البناء العادي) لأن lucide_icons
            # بيمتد من IconData وده متمنع في 3.47+ — والـ patches بتبني تلقائيًا
            # بنفس نسخة Flutter الخاصة بالـ release
            if shorebird release android --artifact apk --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --flutter-version 3.41.9; then
              echo "::endgroup::"
              echo "mode=release" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::shorebird release failed — falling back to a plain flutter build so the run still succeeds."
              echo "::endgroup::"
              flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
              echo "mode=plain" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$MODE" = "plain" ]; then
            echo "::group::Plain flutter build (no Shorebird)"
            flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
            echo "::endgroup::"
            echo "mode=plain" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown mode: $MODE"
            exit 1
          fi

          echo "apk=true" >> "$GITHUB_OUTPUT"

      - name: Prepare APK file
        if: ${{ steps.build.outputs.apk == 'true' }}
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs -type f -name '*-release.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found under build/app/outputs" >&2
            exit 1
          fi
          echo "Found APK: $APK"
          mkdir -p dist
          cp "$APK" "dist/Iman-${{ needs.classify.outputs.version }}-b${GITHUB_RUN_NUMBER}.apk"
          ls -lh dist

      - name: Upload APK Artifact
        if: ${{ steps.build.outputs.apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Iman-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  # ================================================================
  # 3) بناء IPA للايفون (macOS) — نسخة غير موقّعة للتثبيت عبر إعادة التوقيع
  # لو فشل البناء لأي سبب، مش هنفشل الاكشن كله: الـ Release هيطلع بالـ APK
  # ================================================================
  ios:
    name: Build iOS IPA (Unsigned for Sideloading)
    needs: classify
    if: ${{ needs.classify.outputs.mode != 'none' }}
    continue-on-error: true
    outputs:
      ipa_ok: ${{ steps.flag.outputs.ipa_ok }}
    env:
      # This workflow intentionally creates an unsigned device app. Sideloadly /
      # AltStore / iLoader will sign it with the Apple account of the user.
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: CocoaPods Integration
        run: flutter config --no-enable-swift-package-manager

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS App
        id: build_ios
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Create IPA Package
        if: ${{ steps.build_ios.outcome == 'success' }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.classify.outputs.version }}'
          APP_PATH="${GITHUB_WORKSPACE}/build/ios/iphoneos/Runner.app"
          PAYLOAD_DIR="${RUNNER_TEMP}/iman-ipa/Payload"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          rm -rf "${RUNNER_TEMP}/iman-ipa"
          mkdir -p "$PAYLOAD_DIR"
          ditto "$APP_PATH" "$PAYLOAD_DIR/Runner.app"

          IPA_TEST="${RUNNER_TEMP}/Iman-${VERSION}-b${GITHUB_RUN_NUMBER}.ipa"
          (cd "${RUNNER_TEMP}/iman-ipa" && zip -qry -y "$IPA_TEST" Payload)
          unzip -t "$IPA_TEST" > /dev/null

          mkdir -p dist
          mv "$IPA_TEST" dist/

      - name: Upload IPA Artifact
        if: ${{ steps.build_ios.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Iman-IPA
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Set success flag
        id: flag
        if: ${{ steps.build_ios.outcome == 'success' }}
        run: echo "ipa_ok=true" >> "$GITHUB_OUTPUT"

  # ================================================================
  # 4) نشر كل الملفات في GitHub Release واحدة مع مباشر التحميل
  # (بتتخطى لما يكون الـ push كان patch فوري أو بدون تغيّر)
  # ================================================================
  release:
    name: Publish GitHub Release
    needs: [android, ios]
    # الـ Release بيتم بأذن الله طول ما الـ APK اتبنى بنجاح
    if: ${{ always() && needs.android.result == 'success' && needs.android.outputs.apk_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: rel
        run: |
          set -euo pipefail
          VERSION='${{ needs.android.outputs.version }}'
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            TAG='${{ github.ref_name }}'
          else
            TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Iman-APK
          path: dist

      - name: Download IPA artifact
        if: ${{ needs.ios.outputs.ipa_ok == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: Iman-IPA
          path: dist

      - name: Verify at least one file exists
        run: |
          set -euo pipefail
          ls -lh dist
          FOUND=$(find dist -type f \( -name '*.apk' -o -name '*.ipa' \) | wc -l)
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No APK/IPA files were produced." >&2
            exit 1
          fi

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: إيمان ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.apk
            dist/*.ipa
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ## طريقة التثبيت

            **Android**
            - نزّل ملف `Iman-*.apk` من الأسفل وثبّته مباشرة على جهازك.
            - إن طُلب منك ذلك، اسمح بـ "التثبيت من مصادر غير معروفة".

            **iPhone (نسخة غير موقّعة)**
            - نزّل ملف `Iman-*.ipa` من الأسفل.
            - جدد توقيعه بحساب آبل من خلال **Sideloadly** أو **AltStore** أو **iLoader** ثم ثبّته.

            **تحديثات فورية (Code Push)**
            - تحديثات الأندرويد لتعديلات الكود تصل تلقائيًا داخل التطبيق (OTA) بدون إعادة تثبيت — في أول تشغيل بعد الدقاجق القليلة التالية للنشر.

            > كل نسخة كاملة جديدة تحمل رقم Build أعلى (versionCode) حتى يعمل التحديث فوق النسخة القديمة مباشرة.
